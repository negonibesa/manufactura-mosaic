<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manufactura — photo ring ↔ tape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  canvas { display: block; }
  #logo {
    position: fixed; top: 32px; left: 50%; transform: translateX(-50%);
    z-index: 20; pointer-events: none;
    mix-blend-mode: exclusion;
    transition: opacity .25s ease;
  }
  #logo img { height: 18px; width: 198px; }
  #logo.hidden { opacity: 0; }
  #year {
    position: fixed; left: 60px; bottom: 32px;
    z-index: 20; pointer-events: none;
    font-family: "HelveticaNeueCyr", "Helvetica Neue Cyr", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: #222222;
  }
  #tagline {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    z-index: 20; pointer-events: none; white-space: nowrap;
    font-family: "HelveticaNeueCyr", "Helvetica Neue Cyr", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: #222222;
  }
  #curtain {
    position: fixed; left: 0; top: 0; width: 100%; height: 100vh; z-index: 30;
    background: #000; pointer-events: none;
    overflow: hidden;
    transform: translateY(100vh);
  }
  #curtain-inner {
    position: absolute; inset: 0;
  }
  #curtain img, #curtain .poster {
    position: absolute; left: 50%; top: 0;
    width: auto; height: auto;
    max-width: 80vw; max-height: 70vh;
    transform: translateX(-50%);
    pointer-events: none;
    will-change: transform, opacity;
  }
  #curtain .poster.stash {
    visibility: hidden;
  }
  #curtain-text {
    position: absolute; left: 60px; top: 38vh;
    width: 1104px;
    max-width: calc(100vw - 120px);
    text-align: left;
    font-family: "HelveticaNeueCyr", "Helvetica Neue Cyr", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    font-size: 56px;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: #fff;
    pointer-events: none;
  }
  #curtain-text .label {
    display: block;
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 18px;
    line-height: 1.2;
    letter-spacing: 0;
    margin-bottom: 50px;
    width: 1039px;
    max-width: 100%;
  }
  #curtain-text .it {
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: 400;
  }
  #curtain-text .w {
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
  }
  @media (max-width: 700px) {
    #curtain-text { left: 24px; top: 6%; width: auto; max-width: calc(100vw - 48px); font-size: 24px; }
    #curtain-text .label { font-size: 14px; margin-bottom: 20px; }
  }
</style>
</head>
<body>

<div id="logo"><img src="Logo.svg" alt="Мануфактура"></div>
<div id="year">(2026)</div>
<div id="tagline">Художественное пространство · с 1751 года</div>
<div id="curtain"><div id="curtain-inner"><img class="poster" src="Event2.png" alt=""><img class="poster" src="event.png" alt=""><img class="poster" src="Event2.png" alt=""><img class="poster" src="event.png" alt=""><div id="curtain-text"><span class="label">Миссия</span>Мы не&nbsp;конкурируем с&nbsp;онлайн-площадками — мы возвращаем <span class="it">смысл посещения. </span>Мануфактура объединяет просвещение и&nbsp;коллекционирование в&nbsp;одном пространстве, где картину можно <span class="it">рассмотреть,</span> а&nbsp;не&nbsp;пролистать</div></div></div>

<script src="three.min.js"></script>
<script src="images.js"></script>
<script>
(function () {
  const NUM = IMAGE_DATA.length;          // 23 photos from the gallery
  const GAP_PX = 80;                      // visible gap between cards, in screen px
  const RING_PX = 0.57;                   // ring radius as share of the smaller viewport edge
  const ROY = 0.16;                       // auto-rotation speed (rad/s), only in ring mode
  const TILT = 0.07;                      // mouse tilt amplitude
  const OVERLAY = 0.2;                    // white overlay on every card by default
  const UNFOLD_DIST = 10;                 // scroll units needed to fully unfold the tape
  const RISE_DIST = 8;                    // экран 2: чёрная шторка поднимается
  const SHOW_DIST = 6;                    // хвост заливки текста после подъёма (идёт параллельно контенту)
  const CONTENT_DIST = 28;                // текст уходит + стопка собирается (приезд, уменьшение, выныривание)
  const POSTER_DIST = 2;                  // на лист карты афиши (механика "лопасть")
  const POSTERS = 4;                      // сколько карт в стопке афиши

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 1.5, 14);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  const loader = new THREE.TextureLoader();
  const ring = new THREE.Group();
  scene.add(ring);

  const cards = [];   // { group, wrap, mesh, overlay, ang, aspect, done, lean, off, lift, ovT }
  let radius = 0;
  let spacingUnit = 0;                    // card pitch on the tape (world units)
  let tapeSpan = 0;                       // tape length in world units, set in layout()

  // world units per screen pixel at the plane of the ring
  const unitPerPx = () => (2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) / innerHeight;

  // ring radius, card width and tape pitch all computed in screen pixels so the
  // whole ring fits the window and the gap stays ~GAP_PX
  function layout() {
    const upx = unitPerPx();
    const rPx = RING_PX * Math.min(innerWidth, innerHeight);
    radius = rPx * upx;
    const arcPx = (Math.PI * 2 * rPx) / NUM;
    const wPx = Math.max(60, arcPx - GAP_PX);
    const w = wPx * upx;
    spacingUnit = (arcPx + GAP_PX) * upx; // card pitch = card width + gap, keeps the same 80px
    tapeSpan = NUM * spacingUnit;

    cards.forEach(c => {
      c.mesh.scale.set(w, w * c.aspect, 1);
      c.overlay.scale.set(w, w * c.aspect, 1);
    });
  }
  function setAspect(c, aspect, force) {
    if (c.done && !force) return;
    c.aspect = aspect;
    c.done = true;
    layout();
  }

  for (let i = 0; i < NUM; i++) {
    const ang = (i / NUM) * Math.PI * 2;
    const tex = loader.load(IMAGE_DATA[i]);
    tex.encoding = THREE.sRGBEncoding;

    const group = new THREE.Group();
    ring.add(group);

    const wrap = new THREE.Group();       // "sticks" toward the cursor on hover
    group.add(wrap);

    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: tex, toneMapped: false, side: THREE.DoubleSide })
    );
    const overlay = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: OVERLAY, side: THREE.DoubleSide })
    );
    wrap.add(mesh);
    wrap.add(overlay);

    const card = { group, wrap, mesh, overlay, ang, aspect: 1, done: false, lean: 0, off: 0, lift: 0, ovT: OVERLAY };
    cards.push(card);

    const im = tex.image;
    if (im && im.width) setAspect(card, im.height / im.width, true);
  }
  layout();

  // ---- hover via raycast, "stick" like in index.html ----
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let hoverCard = null;

  function cardUnderPointer(e) {
    ndc.x = (e.clientX / innerWidth) * 2 - 1;
    ndc.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    for (const hit of raycaster.intersectObjects(cards.map(c => c.mesh))) {
      return cards.find(c => c.mesh === hit.object);
    }
    return null;
  }
  window.addEventListener('mousemove', (e) => {
    hoverCard = cardUnderPointer(e);
  }, { passive: true });

  // mouse tilt: -1..1, smoothed
  let mx = 0, my = 0, smx = 0, smy = 0;
  window.addEventListener('mousemove', (e) => {
    mx = (e.clientX / innerWidth) * 2 - 1;
    my = (e.clientY / innerHeight) * 2 - 1;
  }, { passive: true });

  // ---- wheel: unfold the ring into a sideways-scrolling tape ----
  let scroll = 0, scrollTarget = 0;
  function addScroll(d) {
    const max = UNFOLD_DIST + RISE_DIST + CONTENT_DIST + POSTER_DIST * (POSTERS - 1);
    scrollTarget = Math.max(0, Math.min(max, scrollTarget + d));
  }
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    addScroll(e.deltaY * 0.02);
    if (e.deltaY > 0) logoEl.classList.add('hidden');
    else if (scrollTarget <= 0.0001 || e.deltaY < 0) logoEl.classList.remove('hidden');
  }, { passive: false });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    layout();
  });

  const curtainEl = document.getElementById('curtain');
  const posters = Array.from(curtainEl.querySelectorAll('.poster')).reverse();  // [0]=верхняя первая показываемая
  const curtainText = document.getElementById('curtain-text');
  const logoEl = document.getElementById('logo');
  // Разбиваем текст на слова (неразрывные пробелы не рвём — предлог едет со словом).
  // Порядок слов = порядок чтения = построчно сверху вниз, слева направо.
  const curtainWords = (() => {
    const words = [];
    const walker = document.createTreeWalker(curtainText, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
      const parts = node.textContent.split(/([ \t\r\n]+)/);
      const frag = document.createDocumentFragment();
      for (const part of parts) {
        if (!part) continue;
        if (/^[ \t\r\n]+$/.test(part)) {
          frag.appendChild(document.createTextNode(' '));
        } else {
          const s = document.createElement('span');
          s.className = 'w';
          s.textContent = part;
          frag.appendChild(s);
          words.push(s);
        }
      }
      node.parentNode.replaceChild(frag, node);
    }
    return words;
  })();
  // Группируем слова в строки по факту вёрстки (пересчитываем при ресайзе/смене шрифта)
  let curtainLines = [];
  function groupCurtainLines() {
    curtainLines = [];
    let cur = null;
    for (const w of curtainWords) {
      const top = w.offsetTop;
      if (!cur || Math.abs(top - cur.top) > 8) {
        cur = { top, words: [] };
        curtainLines.push(cur);
      }
      cur.words.push(w);
    }
  }
  groupCurtainLines();
  window.addEventListener('resize', groupCurtainLines);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(groupCurtainLines);
  let last = performance.now();
  let auto = 0;                            // auto rotation angle (ring mode only)
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    smx += (mx - smx) * (1 - Math.exp(-dt * 4));
    smy += (my - smy) * (1 - Math.exp(-dt * 4));

    // smooth scroll / unfold
    scroll += (scrollTarget - scroll) * (1 - Math.exp(-dt * 10));

    // apply each photo's real proportions once its image has loaded
    for (const c of cards) {
      if (!c.done) {
        const im = c.mesh.material.map.image;
        if (im && im.width) setAspect(c, im.height / im.width);
      }
    }

    const u = Math.min(1, scroll / UNFOLD_DIST);          // 0 = ring, 1 = tape
    const tapeX = Math.max(0, scroll - UNFOLD_DIST);      // sideways scroll after unfold
    auto += ROY * dt * (1 - u);

    const mid = (NUM - 1) / 2;
    for (const c of cards) {
      // ring position (auto-rotated)
      const effAng = c.ang + auto;
      const rx = Math.sin(effAng) * radius;
      const rz = Math.cos(effAng) * radius;
      // tape position (centred line, pans sideways)
      const tx = (c.ang / (Math.PI * 2)) * NUM;           // logical index 0..NUM
      const px = (tx - mid) * spacingUnit - tapeX;
      const py = 0;

      c.group.position.set(rx + (px - rx) * u, 0, rz + (0 - rz) * u);
      const rot = c.ang + auto;
      c.group.rotation.y = rot + (0 - rot) * u;

      // hover "stick"
      const on = c === hoverCard;
      const k = 1 - Math.exp(-dt * 10);
      c.lean += ((on ? smx * 0.25 : 0) - c.lean) * k;
      c.off  += ((on ? smx * 0.3  : 0) - c.off) * k;
      c.lift += ((on ? 0.15        : 0) - c.lift) * k;
      c.ovT  += ((on ? 0 : OVERLAY) - c.ovT) * k;
      c.wrap.rotation.y = c.lean;
      c.wrap.position.set(c.off, c.lift, 0);
      c.overlay.material.opacity = c.ovT;
    }

    ring.rotation.x = -smy * TILT * (1 - u);
    ring.rotation.z = smx * TILT * (1 - u);
    ring.rotation.y = 0;

    camera.position.x = smx * 0.6;
    camera.position.y = 1.5 - smy * 0.5;
    camera.lookAt(0, 0, 0);

    // screen 2: black curtain rises from bottom once the tape is fully unfolded.
    // На 2-м экране только текст; картинка целиком ждёт под низом — она на 3-м экране.
    const curtainProg = Math.min(1, Math.max(0, (scroll - UNFOLD_DIST) / RISE_DIST));
    curtainEl.style.transform = `translateY(${(1 - curtainProg) * 100}vh)`;

    // фон пока не трогаем — всегда чёрный
    const v = 0;
    curtainText.style.color = '#fff';
    // Построчный вайп: стартует как только показался краешек текста
    // (край шторки проходит 118px метки), дальше синхронно со скроллом
    const fillStart = UNFOLD_DIST + (120 / window.innerHeight) * RISE_DIST;
    // лёгкий параллакс: заливка текста чуть отстаёт от шторки — сдвинут старт,
    // но обязательно дозаливает до 100%, чтобы последняя строка была белой
    const fillProg = Math.min(1, Math.max(0, (scroll - fillStart) / (UNFOLD_DIST + RISE_DIST + SHOW_DIST + 0.001 - fillStart)));
    {
      const th = 255 - v;
      const dim = Math.round(v + (th - v) * 0.3);
      const full = `rgb(${th},${th},${th})`, dimC = `rgb(${dim},${dim},${dim})`;
      const M = curtainLines.length;
      for (let L = 0; L < M; L++) {
        const line = curtainLines[L];
        const K = line.words.length;
        let lp = fillProg * M - L;
        lp = lp < 0 ? 0 : lp > 1 ? 1 : lp;
        for (let j = 0; j < K; j++) {
          let x = lp * (K + 1) - j;
          x = x < 0 ? 0 : x > 1 ? 1 : x;
          line.words[j].style.backgroundImage = `linear-gradient(to right, ${full} ${(x * 100).toFixed(1)}%, ${dimC} ${(x * 100).toFixed(1)}%)`;
        }
      }
    }
    // единый поток: текст и карточка едут одной линейной скоростью с начала шторки
    // (не ждут пока шторка откроется — иначе на 2-м экране скролл буксует)
    const contentProg = Math.min(1, Math.max(0, (scroll - UNFOLD_DIST) / (RISE_DIST + CONTENT_DIST)));
    // текст уходит на 60vh, чтобы не обрезаться о верхний край шторки
    curtainText.style.transform = `translateY(${-contentProg * 0.6 * window.innerHeight}px)`;
    const baseTop = 85 - contentProg * 73;
    const activeScale = 1;

    // ---- Афиша-стопка: сначала сборка, потом листание ----
    // CONTENT-фаза (scroll < P0): первая приезжает и уменьшается на 20%, затем
    // выныривают вторая и третья — стопка собирается автоматически, без скролла,
    // просто как дошли до экрана.
    // POSTER-фаза (scroll >= P0): листаем скроллом — ближняя падает, карточки
    // "толкают друг друга", дальняя проявляется из фейда.
    const P0 = UNFOLD_DIST + RISE_DIST + CONTENT_DIST;
    const flipping = scroll >= P0;
    const pageIdx = flipping
      ? Math.min(POSTERS - 1, Math.floor((scroll - P0) / POSTER_DIST))
      : 0;
    const frac = flipping
      ? Math.min(1, Math.max(0, (scroll - P0 - pageIdx * POSTER_DIST) / POSTER_DIST))
      : 0;

    // сборка: вторая выныривает когда карточка почти встала
    const stack = Math.min(1, Math.max(0, (contentProg - 0.75) / 0.25));
    const stackEase = stack * stack * (3 - 2 * stack);   // smoothstep

    const IN = activeScale;
    const S = [IN, IN * 0.72, IN * 0.5];       // ближний, средний, дальний (рабочие размеры)
    const lerp = (a, b, t) => a + (b - a) * t;
    // Лесенка глубины: у каждого слоя свой верхний край (в vh от baseTop), дальние
    // выше — виден краешек. STEP — расстояние между соседними краешками.
    const STEP = 7;
    const TOP = [0, -STEP, -2 * STEP];         // верх слоя 0(ближ),1(сред),2(дальн)

    for (let i = 0; i < POSTERS; i++) {
      const el = posters[i];
      const depth = i - pageIdx;   // 0 = ближняя, 1 = средняя, 2 = дальняя, >=3 = глубже, <0 = ушла
      let vis = true, top = baseTop, scale = IN, op = 1;

      if (depth < 0) {
        vis = false;                             // уже упала — скрыта
      } else if (depth === 0) {
        if (flipping) {
          const f = frac;
          scale = lerp(IN, IN * 1.35, f);        // выдвигается на зрителя
          top = baseTop + f * 120;               // и падает вниз
          op = 1;
        } else {
          scale = IN;
          top = baseTop;
          op = 1;
        }
      } else if (depth <= 2) {
        if (flipping) {
          const f = frac;
          // карта занимает высоту предыдущего слоя (спускается ближе к зрителю)
          scale = lerp(S[depth], S[depth - 1], f);
          top = baseTop + lerp(TOP[depth], TOP[depth - 1], f);
          op = lerp(depth === 2 ? 0.4 : 1, 1, f);
        } else {
          // сборка: выныривает на свой слой (краешек растёт из фейда)
          const s = stackEase;
          scale = lerp(S[depth] * 0.3, S[depth], s);
          top = baseTop + lerp(TOP[depth] - 30, TOP[depth], s);
          op = lerp(0, depth === 2 ? 0.4 : 1, s);
        }
      } else {
        vis = false;                             // карты глубже не видны
        op = 0;
      }

      el.style.visibility = vis ? 'visible' : 'hidden';
      el.style.opacity = op.toFixed(3);
      el.style.transform = `translate(-50%, ${top.toFixed(1)}vh) scale(${scale.toFixed(4)})`;
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
